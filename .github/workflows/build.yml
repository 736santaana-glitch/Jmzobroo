
name: Build Petra Ride Pilot APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PetraRidePilot-Android-Starter.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project and create wrapper
        run: |
          unzip -o PetraRidePilot-Android-Starter.zip -d extracted
          cd extracted/PetraRidePilot
          gradle wrapper --gradle-version 8.9

      - name: Build APK
        run: |
          cd extracted/PetraRidePilot
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PetraRidePilot-debug-apk
          path: extracted/PetraRidePilot/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
