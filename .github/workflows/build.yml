
name: Build Petra Ride Pilot APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project files
        run: |
          set -e
          unzip -o PetraRide-Phone-Build-Kit.zip -d kit

          STARTER_ZIP="$(find kit -type f -iname '*starter*.zip' -print -quit)"
          test -n "$STARTER_ZIP"

          mkdir -p extracted
          unzip -o "$STARTER_ZIP" -d extracted

      - name: Build Android APK
        shell: bash
        run: |
          set -euxo pipefail

          SETTINGS_FILE="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          test -n "$SETTINGS_FILE"

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          cd "$PROJECT_DIR"

          echo "Searching for Android application Gradle file..."

          APP_GRADLE="$(python3 - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])

          candidates = list(root.rglob("build.gradle.kts"))
          candidates += list(root.rglob("build.gradle"))

          for p in candidates:
              lines = p.read_text(errors="replace").splitlines()
              for line in lines:
                  if "com.android.application" in line and "apply false" not in line:
                      print(p)
                      raise SystemExit(0)

          print("ERROR: Android application Gradle file not found.", file=sys.stderr)
          for p in candidates:
              print(p, file=sys.stderr)
          raise SystemExit(1)
          PY
          )"

          echo "Found application file: $APP_GRADLE"

          python3 - "$APP_GRADLE" <<'PY'
          from pathlib import Path
          import re
          import sys

          p = Path(sys.argv[1])
          content = p.read_text()
          is_kotlin = p.name.endswith(".gradle.kts")

          if "compileOptions" not in content:
              if is_kotlin:
                  java_options = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """
              else:
                  java_options = """
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          """

              content, count = re.subn(
                  r'(?m)^(\s*)android\s*\{',
                  lambda m: m.group(0) + java_options,
                  content,
                  count=1
              )

              if count != 1:
                  raise SystemExit("Could not find android { block")

          if "kotlinOptions" not in content:
              if is_kotlin:
                  kotlin_options = """
              kotlinOptions {
                  jvmTarget = "17"
              }
          """
              else:
                  kotlin_options = """
              kotlinOptions {
                  jvmTarget = '17'
              }
          """

              content, count = re.subn(
                  r'(?m)^(\s*)android\s*\{',
                  lambda m: m.group(0) + kotlin_options,
                  content,
                  count=1
              )

              if count != 1:
                  raise SystemExit("Could not add Kotlin JVM target")

          p.write_text(content)
          print("Java and Kotlin configured for JVM 17")
          PY

          gradle wrapper --gradle-version 8.9
          chmod +x gradlew

          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PetraRidePilot-debug-apk
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
