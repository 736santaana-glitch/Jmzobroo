
name: Build Petra Ride Pilot APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project files
        run: |
          set -e
          unzip -o PetraRide-Phone-Build-Kit.zip -d kit

          STARTER_ZIP="$(find kit -type f -iname '*starter*.zip' -print -quit)"
          test -n "$STARTER_ZIP"

          mkdir -p extracted
          unzip -o "$STARTER_ZIP" -d extracted

      - name: Build Android APK
        shell: bash
        run: |
          set -e

          SETTINGS_FILE="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          test -n "$SETTINGS_FILE"

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          cd "$PROJECT_DIR"

          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"
          test -f "$APP_GRADLE"

          python3 - "$APP_GRADLE" <<'PY'
          from pathlib import Path
          import re
          import sys

          p = Path(sys.argv[1])
          content = p.read_text()

          if "compileOptions" not in content:
              content, count = re.subn(
                  r'(?m)^android\s*\{',
                  '''android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          ''',
                  content,
                  count=1
              )
              if count != 1:
                  raise SystemExit("Could not find android { block in app/build.gradle.kts")

          p.write_text(content)
          print("Java and Kotlin targets configured to JVM 17")
          PY

          gradle wrapper --gradle-version 8.9
          chmod +x gradlew

          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PetraRidePilot-debug-apk
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
